
<!DOCTYPE html>
<html>
  <head>
    <title>Exp 2</title>
    <!-- Get all the required libraries -->
    <script src="https://unpkg.com/jspsych@8.2.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-slider-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
    <script src="https://unpkg.com/@jspsych/plugin-browser-check@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!-- defining all face stims -->
    <script src="stims.js"></script>
    
    <!-- Styling -->
    <link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" type="text/css" />  
    <link rel="stylesheet" href="lerenkijken_style.css">
    <style> 
       
    </style>  
  </head>
  <body></body>
  <script>

    //Initialize jsPsysch
    const jsPsych = initJsPsych({
        show_progress_bar: true,
        message_progress_bar: '',
        on_finish: function() {
            jsPsych.data.displayData();
        }
    });



    // trial parameters
    const person_presentation_time = 1000
    const post_person_gap = 500
    const grid_presentation_time = 2000
    const post_grid_gap = 500

    /*
    NOTE!!!!!

    // const stims    is defined in another file named: stim_names.js

    */

    function make_grid_stim(indices){
      let min_size = Math.min( window.innerWidth/3, window.innerHeight/4)
      let dim = min_size * 0.8
      let w = 2444, h = 1718
      let scaling = dim/w
      let dim_w = w * scaling 
      let dim_h = h * scaling 

      let i = 0
      let grid_stim = ''
      for (let row=0;row<4;row++){
            for (let col=0;col<3;col++){                
                grid_stim += `<img src="${stims[indices[i]]}" width="${dim_w}" height="${dim_h}" >`
                i++
            }
            grid_stim += '<br>' 
      }
      return grid_stim

    }



    const preload = {
        type: jsPsychPreload,
        images: stims,
    }

    let exp_id = 'exp_2_piloting'
    let info_object = {mean_rt: 3.77, accuracy: 0.98, condition: 'valid cue'}
    // subject id
    let exp_version = '0.0.8'
    const url_vars = jsPsych.data.urlVariables()

    url_vars['exp_version'] = exp_version
    url_vars['exp_id'] = exp_id
    url_vars['user_summary_info'] = info_object

    const user_info_trial = {
        type: jsPsychBrowserCheck,
        data: url_vars
    };

    function make_trial_sequence(target_presence){

        let all_indices = [...stims.keys()]

        let target_index = jsPsych.randomization.randomInt(0, stims.length-1)

        all_indices.splice(target_index, 1)

        let all_but_target_indices = all_indices

        let crowd_indices 
        

        if (target_presence){
            crowd_indices = jsPsych.randomization.sampleWithoutReplacement(all_but_target_indices, 11) 
            crowd_indices.push(target_index)
            crowd_indices = jsPsych.randomization.shuffle(crowd_indices)
        } else {
            crowd_indices = jsPsych.randomization.sampleWithoutReplacement(all_but_target_indices, 12) 
        }

        // Make subtrials
        const show_person_to_search = {
            type: jsPsychImageKeyboardResponse,
            stimulus: stims[target_index],
            stimulus_width: () => {return Math.min( window.innerWidth/3, window.innerHeight/4) * 1.5 },
            prompt: "<p>Find this person in the crowd.</p>",
            choices: 'NO_KEYS',
            trial_duration: person_presentation_time,
            post_trial_gap: post_person_gap,
            data:{
                label:'show_person_to_search',
                target: target_index,
                target_presence: target_presence ? 'present' : 'absent',
            }

        };

        const show_grid = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: make_grid_stim(crowd_indices),
        choices: 'NO_KEYS',
        trial_duration: grid_presentation_time,
        save_trial_parameters:{stimulus:false},
        post_trial_gap: post_grid_gap,
        data:{
            label:'show_grid',
            crowd: crowd_indices.toString()
        }
        };

        const ask_presence = {
            type: jsPsychImageButtonResponse,
            stimulus:  stims[target_index],
            stimulus_width: () => {return Math.min( window.innerWidth/3, window.innerHeight/4) * 1.5 },
            prompt: "<p>Was this person there?</p>",
            choices: ["Yes", "No"],
            data:{
                label:'ask_presence',
                target_presence: target_presence,
            },
            on_finish: function(data){

                if( data.response != Number(data.target_presence) ){ // this is reversed because a yes response gets resp 0
                data.correct = 1;
                } else {
                data.correct = 0;
                }
            }
        }

        const ask_confidence = {
            type: jsPsychImageSliderResponse,
            stimulus: stims[target_index],
            stimulus_width: function(){return Math.min( window.innerWidth/3, window.innerHeight/4) },
            require_movement:true,
            labels: ["<p>Not sure</p>", "<p>Very sure<p>"],
            prompt: function(){
                let response_data =  jsPsych.data.getLastTrialData().trials[0]
                let prev_response = ['PRESENT', 'ABSENT'][response_data.response]
                return "<p>You said this person was "+prev_response+"<br>How sure are you about that?</p>"
            },
            post_trial_gap: 750,
            button_label: "Continue",    
            data:{
                label:'ask_confidence',
            }
        };

        const one_trial_procedure = {
            timeline: [show_person_to_search, show_grid, ask_presence, ask_confidence]
        }

        return one_trial_procedure
    }

    // build trial sequence:
    const intro = {
        type: jsPsychHtmlButtonResponse,
        stimulus: "<h3>Welcome to this visual search demo-experiment! "+exp_version+"</h3>"+
        "<p>There will be 12 trials.</p><p>In the end, you can choose to save your data on OSF.</p>",
        choices: ["Begin!"],
        data:{
            label:'intro',
        }
    };

    const styling_trial = {
        type: jsPsychHtmlButtonResponse,
        stimulus:"<h1>Welcome! This is h1 text</h1>"+
        "<h2>And this is text in style h2</h2>"+
        
        
        "<h3>There will be 12 trials(h3) </h3>"+
        "<p>With a p tag the text is likt this There will be 12 trials.</p><p>In the end, you can choose to save your data on OSF.</p>",
        choices: ["Begin!"],
        data:{
            label:'intro',
        }
    };
    
    

    const debrief = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function(){
            let n_trials =jsPsych.data.get().filter({label: 'ask_presence'}).count()
            let n_correct = jsPsych.data.get().filter({label: 'ask_presence', correct:1}).count()
            let p_confidence = jsPsych.data.get().filter({label: 'ask_confidence'}).select('response').mean()
            return "<h3>You are done. Thanks!</h3>"+
            `<p>You answered ${n_correct} of ${n_trials} questions correctly.</p>`+
             `<p>You were about ${Math.round(p_confidence)}% sure of your answers.</p>`+
            "<p>Tap below to save your data to OSF! Or close this window instead.</p>"
        },
        save_trial_parameters:{stimulus:false},
        choices: ["Save data!"],
        data:{
            label:'debrief',
        },
        on_start: function(){
            jsPsych.progressBar.progress = 1; // set progress bar to 100% full.
        }
    };
    const outro = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: () => {return "Your data was successfully saved!"+
        "You may close this window now"
        },
        choices: 'NO_KEYS',
        data:{
            label:'outro',
        },
        on_start: function(){
            jsPsych.progressBar.progress = 1; // set progress bar to 100% full.
        }
    };




    // get summary data
    let summary_data = "[....]" 

    window.xhr = $.post('https://www.lerenkijken.nl/api/get_summary', {'exp_id': exp_id}).done(function(res){
    if(xhr.status == 200){
        // console.log('OK!');
        summary_data = res 
        } else{
            console.log(xhr.status);
            summary_data = '  retrieval of summary datas did not return 200  '
        }
    }).fail(function(){
        console.log(xhr.status);
        summary_data = '  retrieval of summary data failed  '
    });

    summary_data

    const save_data = {
        type: jsPsychCallFunction,
        async: true,
        func: function(done){
            window.xhr = $.post('https://www.lerenkijken.nl/api/save', jsPsych.data.get().json()).done(function(){
                if(xhr.status == 200){
                    // console.log('OK!');
                    done()
                } else{
                    console.log(xhr.status);
                }
            }).fail(function(){
                console.log(xhr.status);
            });

        }
    }
    
    let present_10_absent_2 = [
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(false),
        make_trial_sequence(false),
    ]

    let present_2_absent_10 = [
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(true),
        make_trial_sequence(true),
    ]

    let present_6_absent_6 = [
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(false),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
        make_trial_sequence(true),
    ]

    present_10_absent_2 = jsPsych.randomization.shuffle(present_10_absent_2)
    present_2_absent_10 = jsPsych.randomization.shuffle(present_2_absent_10)
    present_6_absent_6  = jsPsych.randomization.shuffle(present_6_absent_6 )

    // Put the trials on a 'timeline' in the right order
    // const timeline_0 = [user_info_trial, preload, intro, ...present_10_absent_2, debrief, save_data, outro]
    // const timeline_1 = [user_info_trial, preload, intro, ...present_2_absent_10, debrief, save_data, outro]
    // const timeline_2 = [user_info_trial, preload, intro, ...present_6_absent_6, debrief, save_data, outro]

    // piloting from 
    const timeline_0 = [user_info_trial, preload, styling_trial, intro, ...present_6_absent_6, debrief,  save_data, outro] // , 
    // const timeline_1 = [user_info_trial, preload, intro, make_trial_sequence(false),make_trial_sequence(true), debrief, save_data, outro]
    // const timeline_2 = [user_info_trial, preload, intro, make_trial_sequence(false),make_trial_sequence(true), debrief, save_data, outro]

    jsPsych.run(timeline_0);

    // condition assignment

    // async function createExperiment() {
    // const condition = await jsPsychPipe.getCondition("ayWpeEMf2JK1");

    // if(condition == 0) { timeline = timeline_0; }
    // if(condition == 1) { timeline = timeline_1; }
    // if(condition == 2) { timeline = timeline_2; }

    // jsPsych.run(timeline);
    
    // }
    // createExperiment();
                  

  </script>
</html>
