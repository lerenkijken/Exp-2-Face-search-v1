
<!DOCTYPE html>
<html>
  <head>
    <title>Exp 2 - Face search</title>
    <!-- Get all the required libraries -->
    <script src="https://unpkg.com/jspsych@8.2.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-slider-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
    <script src="https://unpkg.com/@jspsych/plugin-browser-check@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!-- defining all face stims -->
    <script src="stims.js"></script>
    
    <!-- Styling -->
    <link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" type="text/css" />  
    <link rel="stylesheet" href="lerenkijken_style_exp2.css">
    <style> 
        body {background-color:'#ffcc00';}
        .faces_background {color: black; background-color: white;}
  
    </style>
  </head>
  <body></body>
  <script>

/*
    blue
    Rgb 45,0,200
    Hex #2d00c8

    yellow
    Rgb 255,204,0
    Hex #ffcc00

    pink
    Rgb 255,102,153
    Hex #ff6699

    orange
    Rgb 254,153,0
    Hex #fe9900

*/

    //Initialize jsPsysch
    const jsPsych = initJsPsych({
        show_progress_bar: true,
        message_progress_bar: '',
        on_finish: function() {
            jsPsych.data.displayData();
        }
    });

    // meta info 
    const img_server_src = 'https://www.lerenkijken.nl/cdn/'
    stims = stims.map( (s) => img_server_src + s)
    function add_trial_duration (data) {data.measured_trial_duration = data.time_elapsed - jsPsych.data.get().last(2).values()[0].time_elapsed}


    // trial parameters
        // note that since there are ~600 face stims, we can have max 45 trials if we want every face to be presented at most once. 
    const target_presence_absence_trial_counts =[ [2,10],   [6,6],    [10,2] ] 

    const person_presentation_time = 1000
    const post_person_gap = 500
    const grid_presentation_time = 1500
    const post_grid_gap = 500
    const n_crowd_cols = 3
    const n_crowd_rows = 4
    const crowd_size = n_crowd_cols * n_crowd_rows
    const crowd_and_target_size = crowd_size + 1



    const exp_id = 'exp_2'
    // subject id
    let exp_version = '0.1.0'
    const url_vars = jsPsych.data.urlVariables()

    const exp_start_datetime = Date.now()
    url_vars['exp_start_datetime'] = Date(exp_start_datetime)
    url_vars['exp_start_UTCms'] = exp_start_datetime

    url_vars['exp_version'] = exp_version
    url_vars['exp_id'] = exp_id

    const user_info_trial = {
        type: jsPsychBrowserCheck,
        data: url_vars
    };



    /*
    NOTE!!!!!

    // const stims    is defined in another file named: stims.js

    */

    function make_grid_stim(trial_stims){
      let min_size = Math.min( window.innerWidth/3, window.innerHeight/4)
      let dim = min_size * 0.8
      let w = 2444, h = 1718
      let scaling = dim/w
      let dim_w = w * scaling 
      let dim_h = h * scaling 

      let i = 0
      let grid_stim = ''
      
      for (let row=0; row<n_crowd_rows; row++){
            for (let col=0; col<n_crowd_cols; col++){                
                grid_stim += `<img src="${trial_stims[i]}" width="${dim_w}" height="${dim_h}" >`
                i++
            }
            grid_stim += '<br>' 
      }
      return grid_stim

    }







    function make_trial_sequence(target_presence, trial_stims){
                    
        // pick random face from trial stims as ta
        let target_stim;
        let target_index = jsPsych.randomization.randomInt(0, trial_stims.length-1)

        if (target_presence){
            target_stim = trial_stims.slice(target_index, target_index+1)   // select target face
            let removed_stim = trial_stims.splice( (target_index+1) % trial_stims.length,  1 )  // remove other (non-target) face from full crowd
        } else {
            target_stim = trial_stims.splice(target_index, 1)  // select target face and remove it from the full crowd
        }

        
        // Make subtrials 
        const show_person_to_search = {
            type: jsPsychImageKeyboardResponse,
            stimulus: target_stim,
            stimulus_width: () => {return Math.min( window.innerWidth/3, window.innerHeight/4) * 1.5 },
            prompt: "<p>Zoek deze persoon in de volgende groep.</p>",
            choices: 'NO_KEYS',
            trial_duration: person_presentation_time,
            post_trial_gap: post_person_gap,
            data:{
                label:'show_person_to_search',
                target_presence: target_presence ? 'present' : 'absent',
            },
            css_classes: ['faces_background'],
            save_trial_parameters: {post_trial_gap: true, }

        };

        const show_grid = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: make_grid_stim(trial_stims),
            choices: 'NO_KEYS',
            trial_duration: grid_presentation_time,
            save_trial_parameters:{stimulus:false},
            post_trial_gap: post_grid_gap,
            data:{
                label:'show_grid',
                crowd: trial_stims
            },
            css_classes: ['faces_background'],
            save_trial_parameters: {post_trial_gap: true, }
        };

        const ask_presence = {
            type: jsPsychImageButtonResponse,
            stimulus: target_stim,
            stimulus_width: () => {return Math.min( window.innerWidth/3, window.innerHeight/4) * 1.5 },
            prompt: "<p>Zat deze persoon in de groep?</p>",
            choices: ["Ja", "Nee"],
            data:{
                label:'ask_presence',
                target_presence: target_presence,
            },
            on_finish: function(data){
                add_trial_duration(data)

                if( data.response != Number(data.target_presence) ){ // this is reversed because a yes response gets resp 0
                data.correct = 1;
                } else {
                data.correct = 0;
                }
            },
            css_classes: ['faces_background']
        }

        const ask_confidence = {
            type: jsPsychImageSliderResponse,
            stimulus: target_stim,
            stimulus_width: function(){return Math.min( window.innerWidth/3, window.innerHeight/4) },
            require_movement:true,
            labels: ["<p align='right'><b>← Niet zeker</b></p>",'', "<p align='left'><b>Heel zeker →</b></p>"],
            prompt: function(){
                let response_data =  jsPsych.data.getLastTrialData().trials[0]
                let prev_response = ['WEL', 'NIET'][response_data.response]
                return `<p>Je gaf aan dat deze persoon er <b>${prev_response}</b> was.<br>Hoe zeker weet je dat?</p>`
            },
            post_trial_gap: 750,
            button_label: "Volgende",    
            data:{
                label:'ask_confidence',
            },
            css_classes: ['faces_background'],
            save_trial_parameters: {post_trial_gap: true}
        };

        const one_trial_procedure = {
            timeline: [show_person_to_search, show_grid, ask_presence, ask_confidence]
        }

        return one_trial_procedure
    }

    // Other trials
    const intro = {
        type: jsPsychHtmlButtonResponse,
        stimulus: () => "<h2>Leuk dat je meedoet! "+exp_version+"</h2>"+
        `<p>Je gaat zo ${n_trials} keer een persoon zoeken in een groep.</p>`+
        "<p>Jij geeft dan aan of die er was (of niet), én hoe zeker je dat weet!</p>"+
        "<p>Klaar voor?</p>",
        choices: ["Begin!"],
        data:{
            label:'intro',
        },
    };

    const ask_performance = {
        type: jsPsychHtmlSliderResponse,
        stimulus:()=>{return `<h2>Dat was 'm! Hoe vond je het gaan?</h2>`+
        `<p>Je hebt in totaal naar ${n_trials} mensens gezocht.<br>Hoeveel 'Ja/Nee'-vragen denk je dat je goed had?</p>`},
        require_movement:true,
        labels:()=>{return ["<h3>0</h3>", `<h3>${n_trials}</h3>`]},
        min: 0, 
        max: ()=>{return n_trials},
        slider_start: 0, 
        button_label: "Volgende",    
        data:{
            label:'ask_performance',
        },
    };


    const debrief = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function(){
            let n_trials =jsPsych.data.get().filter({label: 'ask_presence'}).count()
            let n_correct = jsPsych.data.get().filter({label: 'ask_presence', correct:1}).count()
            let p_confidence = jsPsych.data.get().filter({label: 'ask_confidence'}).select('response').mean()
            return "<h3>Zo goed ben jij met gezichten!</h3>"+
            `<p>Je had <b>${n_correct} van de ${n_trials}</b> vragen goed!</p>`+
            `<p>Je was ${Math.round(p_confidence)}% zeker van je antwoorden.</p>`
        },
        save_trial_parameters:{stimulus:false},
        choices: ["Terug naar de homepage!"],
        data:{
            label:'debrief',
        },
        on_start: function(){
            jsPsych.progressBar.progress = 1; // set progress bar to 100% full.
        },
    };
    const outro = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: () => {return "Your data was successfully saved!"+
        "You may close this window now"
        },
        choices: 'NO_KEYS',
        data:{
            label:'outro',
        },
        on_start: function(){
            jsPsych.progressBar.progress = 1; // set progress bar to 100% full.
        },
    };

    // get summary data
    let summary_data = null 
    try {
        window.xhr = $.post('https://www.lerenkijken.nl/api/get_summary', {'exp_id': exp_id}).done(function(res){
        if(xhr.status == 200){
            // console.log('OK!');
            summary_data = res 
            } else{
                console.log(xhr.status);
                summary_data = '  retrieval of summary datas did not return 200  '
            }
        }).fail(function(){
            console.log(xhr.status);
            summary_data = '  retrieval of summary data failed  '
        });
    } catch (error){
        console.error(error);
    }



    const save_data = {
        type: jsPsychCallFunction,
        async: true,
        func: function(done){
            try {
                window.xhr = $.post('https://www.lerenkijken.nl/api/save', jsPsych.data.get().json()).done(function(){
                    if(xhr.status == 200){
                        // console.log('OK!');
                        done()
                    } else{
                        console.log(xhr.status);
                    }
                }).fail(function(){
                    console.log(xhr.status);
                });
            } catch (error){
                console.error(error);
            }
            done()
        },
        on_start: function(){
            // write summary data to the first object
            let summary_object = {}   

            let n_trials = jsPsych.data.get().filter({label: 'ask_presence'}).count()
            let n_correct = jsPsych.data.get().filter({label: 'ask_presence', correct:1}).count()
            
            summary_object.mean_accuracy = n_correct / n_trials

            summary_object.mean_confidence = jsPsych.data.get().filter({label: 'ask_confidence'}).select('response').mean() 
            

            jsPsych.data.get().first(1).values()[0]['user_summary_info'] = summary_object
        },
    }
    

    /// Experiment design

    // randomly select present/absent trial counts
    let [n_present_trials, n_absent_trials] = get_rand_from_array(target_presence_absence_trial_counts)
    let n_trials = n_present_trials + n_absent_trials

    // an array with true's and false's (i.e. target presence) -> then shuffles 
    let target_presence_array = [...Array(n_present_trials).fill(true), ...Array(n_absent_trials).fill(false)]
    let shuffled_target_presence_array = jsPsych.randomization.shuffle(target_presence_array)


    // make an array with array's of shuffled face stims
    let shuffled_face_stims = jsPsych.randomization.shuffle(stims)
    let face_stims_array = [] 
    let stims_to_preload = []

    for (let face_stim_idx=0; face_stim_idx < crowd_and_target_size*n_trials; face_stim_idx += crowd_and_target_size){ 
          let chunk_of_stims = shuffled_face_stims.slice(face_stim_idx, face_stim_idx+crowd_and_target_size)
          face_stims_array.push(chunk_of_stims)
          stims_to_preload.push(...chunk_of_stims)
    }

    const preload_batch = {
        type: jsPsychPreload,
        images: stims_to_preload,
        message: "<p>Foto's laden:</p>",
    } 

    // make experimental trials
    let experimental_trials = []
    for (let t=0; t < n_trials;  t++){ 
          let trial = make_trial_sequence(shuffled_target_presence_array[t], face_stims_array[t])
          experimental_trials.push(trial)
    }

    // define & run the exp. timeline
    const timeline = [user_info_trial, preload_batch, intro, ...experimental_trials, ask_performance, save_data, debrief,] 

    jsPsych.run(timeline);



    // utility functions
     // extra utility functions
    function get_rand_rgb_str(){
        return `rgb(${Math.round(Math.random()*255)}, ${Math.round(Math.random()*255)}, ${Math.round(Math.random()*255)})`
    }

    function get_rand_int(min, max) { 
        // get radom integer value between min max, both inclusive
        min = Math.ceil(min);
        max = Math.floor(max);
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    
    function get_rand_from_array(array) {
        let i = get_rand_int(0, array.length - 1)
        return array[i]
    }
    
    function get_rand_float(min, max) {
        return Math.random() * (max - min) + min;
    }

    function get_dist(x1, y1, x2, y2) {
        return ( (x2-x1)**2 + (y2-y1)**2 )**0.5
    }

  </script>
</html>
